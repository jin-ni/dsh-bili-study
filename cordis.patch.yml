# ============================================================================
# dsh-bili-study —— DSH bundle patch
# ============================================================================
# 装进某个 profile 后，只要它的 `dsh.profile.bundles` 里列了 dsh-bili-study，
# 本插件就生效（设置页「B站学习」+ 8 个工具 + /api/bili-study 路由）。
#
#   dsh plugin --profile desktop add link:<本目录>
#
# 真正的用户配置在插件自己的 config.json 与 DSH 原生设置页里，这里只放默认值。
# ============================================================================

- insert:
    - id: bili-study
      name: dsh-bili-study
      config: {}
